services:
  gateway:
    build: ./services/gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - GATEWAY_PORT=3000
      - COLLECTOR_URL=http://collector:8080
      - ANALYZER_URL=http://analyzer:5000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      collector:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  collector:
    build: ./services/collector
    ports:
      - "${COLLECTOR_PORT:-8080}:8080"
    environment:
      - COLLECTOR_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  analyzer:
    build: ./services/analyzer
    ports:
      - "${ANALYZER_PORT:-5000}:5000"
    environment:
      - ANALYZER_PORT=5000
      - ALERT_THRESHOLD=${ALERT_THRESHOLD:-90.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
